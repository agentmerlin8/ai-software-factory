name: kit-ci

on:
  push:
  pull_request:

jobs:
  kit-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — readiness pin-resolution checks
                           # resolve concrete pins against ancestor commits
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # the documented floor (stdlib tomllib)
      - name: Control-plane tests
        run: python3 -m unittest
      - name: Gate selftest (acceptance harness)
        run: python3 tools/gates/test_gate.py
      - name: Validate workspace + environment templates
        run: >-
          python3 tools/config_validator.py
          templates/workspace/workspace.toml
          templates/workspace/environments/local.toml
          templates/workspace/environments/github.toml
      - name: Genericization tripwire (banned-token sweep)
        run: python3 tools/check_genericization.py
