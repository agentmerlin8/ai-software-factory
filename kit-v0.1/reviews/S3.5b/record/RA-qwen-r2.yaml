      evidence: "the new fail-closed guard in _put_record_checks ('record is None' -> put(\"review_head_match\", False, \"record unreadable — head match cannot be established (fail closed)\") and the matching no_open_blocker_major branch) is exercised by no test in the package: every READY_FOR_REVIEW / MERGE_ELIGIBLE fixture in the tools/tests/test_controller.py diff (test_ready_for_review_record_head_rule, test_ready_for_review_refuses_open_blocker_major, test_merge_eligible_refuses_unresolvable_head_sha, TestMergeEligibleRecordHeadRule, TestMultirepoSetLevel.merge_ev) seeds an existing fake_record, so a production change flipping that first branch to put(\"review_head_match\", True, ...) leaves every test green while a refused transition persists a check_results row claiming a head match on an unreadable record; only the review-record-path refusals at REVIEWING (test_reviewing_refuses_missing_record_path) are covered, and they use the separate REVIEWING put() calls, not _put_record_checks"
      required_change: "add controller fixtures that drive READY_FOR_REVIEW and MERGE_ELIGIBLE with review_record pointing at a missing (or uncontained/unparseable) record directory and assert the persisted check_results carry review_head_match=False and no_open_blocker_major=False with the fail-closed details, anchored at the _put_record_checks hunk in tools/controller.py"
      actionable: true
