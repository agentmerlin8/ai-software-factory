  findings:
    - id: RA-001
      severity: minor
      rubric_dimension: test_quality
      artifact_reference: package:diff@tools/review/tests/test_package.py:443
      evidence: "test_origin_with_and_without_git_suffix_same_package pins only the HTTPS origin class: it builds with 'https://example.com/owner/repo' vs '…/repo.git' and anchors with assertIn(\"repo: https://example.com/owner/repo.git\\n\"). No test in the package exercises an SSH origin without the '.git' suffix; the preceding visible test asserts only 'repo: git@github.com:owner/repo.git' for an origin that already carries '.git', which stays green with or without canonical_repo_url. Production change that passes falsely: delete canonical_repo_url and revert the call site to 'origin = strip_userinfo(origin)' — an SSH checkout whose origin is 'git@github.com:owner/repo' (no suffix) would again rebuild a non-identical package, and every test in this diff stays green because neither the byte-equality assertion nor the assertIn anchor covers that input class."
      required_change: "Add a case in the same fixture class that builds with an SSH origin lacking the suffix ('git@github.com:owner/repo'), then set-url to the '.git' form, and asserts the two packages are byte-identical plus assertIn(\"repo: git@github.com:owner/repo.git\\n\") — so removing canonical_repo_url fails the suite for the SSH class too, anchored at the cited test hunk."
      actionable: true
