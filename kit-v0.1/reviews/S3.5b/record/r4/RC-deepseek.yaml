  findings:
    - id: RC-001
      severity: minor
      rubric_dimension: contract_fidelity
      artifact_reference: package:diff@tools/controller.py:673
      evidence: "Asymmetric check bookkeeping vs the frozen decision \"a malformed record is not valid evidence\" (S3.5b external review P2 fix applied in this round): _put_record_checks writes `put(\"review_head_match\", not head_errs, head_errs or (f\"record valid at head {head_ev!r} (exact match, record-tail commits, or a v1 ancestor)\" if head_ev else \"head rule not evaluated\"))` and computes `head_errs = [e for e in errs if e.startswith(\"head rule\")]`. But record_gate.evaluate returns right after an authority failure (\"errs.extend(check_record(...)) ... if errs: return errs\"), so when the record authority rejects the record no error ever starts with \"head rule\". Failed record authority => the gate has never evaluated the head rule; `_put_record_checks` receives a non-None record and errs containing only authority errors; head_errs is empty; so the persisted transition check `review_head_match` lands as ok with the detail 'record valid at head ... (exact match, record-tail commits, or a v1 ancestor)' — a claim that the sibling check in the same check_results (`review_record_valid`: 'record rejected by the authority: ...') explicitly contradicts. The record-unreadable branch (record is None) correctly fails this check closed ('head match cannot be established' — fail closed), but the readable-but-rejected branch records a false positive claim. This is a demonstrable reading of the delivered code, it does not change any verdict (review_record_valid and no_open_blocker_major both fail closed, so the transition is still refused — severity is therefore capped at minor), but it falsifies the internal evidence trail for exactly the case the round-4 'authority first' defect-fix order was built for."
      required_change: "When authority_errs are non-empty, review_head_match must be recorded as False with a fail-closed detail (e.g. 'head match cannot be established — the record was rejected by the authority'), mirroring the record-unreadable branch; only a head-rule evaluation that actually ran on an authority-accepted record may set review_head_match true. This requires an authority-clean guard before the `not head_errs` computation in _put_record_checks."
      actionable: true