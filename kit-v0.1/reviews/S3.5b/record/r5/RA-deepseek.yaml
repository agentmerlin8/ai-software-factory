  findings:
    - id: RA-001
      severity: major
      rubric_dimension: test_quality
      artifact_reference: package:diff@tools/controller.py:690
      evidence: "the READY_FOR_REVIEW and MERGE_ELIGIBLE pr-binding guard `put(\"review_record_pr\", pr_expect is not None and str(rec_pr) == pr_expect, ...)` added by this hunk (package:diff@tools/controller.py:~599-704, `_put_record_checks`) exists to stop a named defeat the code itself documents — \"without this, a valid record for a sibling PR at the same head (or a qualifying v1 ancestor) is substituted at the later transitions (S3.5b external review P1)\" — but no test exercises it at either of those two transitions. In tools/tests/test_controller.py every seeded DRAFT_OPENED row (`chain_to` and `draft_row` default pr=\"42\") and every `fake_record(...)` used by test_ready_for_review_record_head_rule, test_ready_for_review_refuses_open_blocker_major, test_ready_for_review_authority_failure_never_claims_head_match, test_merge_eligible_refuses_unresolvable_head_sha, TestMergeEligibleRecordHeadRule and the two `merge_ev()` helpers agree on pr 42; the only pr-mismatch tests (`test_draft_opened_to_reviewing_pr_number_roundtrip`, `test_reviewing_refuses_pr_mismatch`) walk the REVIEWING transition, whose inline check is a SEPARATE copy in the `if to == \"REVIEWING\":` block, not `_put_record_checks`. Deleting the pr-equality (or replacing it with True) leaves the whole suite green while a valid, authority-clean record for a sibling PR at the same head — or, via the controller's `allow_v1_ancestor=True`, at a qualifying v1 ancestor — clears READY_FOR_REVIEW and MERGE_ELIGIBLE for this story, which is precisely the substitution the comment says must not happen; the fail-closed branch for a detail-less historical DRAFT_OPENED row (pr_expect None) is likewise never exercised at these transitions."
      required_change: "add controller tests (via the public request path, since the guard vanishes only in production) for READY_FOR_REVIEW and MERGE_ELIGIBLE in which a valid, authority-clean record whose `pr` differs from the seeded DRAFT_OPENED pr_number is refused on `review_record_pr`, and one where a historical DRAFT_OPENED row carries no evidence detail (pr_expect None) is refused fail-closed; the tests must go red if the pr-equality at package:diff@tools/controller.py:690 is deleted or inverted."
      actionable: true