  findings:
    - id: RC-001
      severity: major
      rubric_dimension: contract_fidelity
      artifact_reference: package:diff@.github/CODEOWNERS:1
      evidence: 'The frozen slice boundary excludes merge-gate changes from this slice. The issue body states: "Explicitly not in S3.5b: reviewer prompt/model tuning (calibration-gated, separate increments); any change to who may merge; S4''s remaining runbook/process/agent/adapter content; execution-seam launch work." The build-plan repeats it: "Explicitly not in S3.5b: ... any change to the owner merge gate." The only owner decisions recorded in the frozen contract (2026-10-31) are O1 (v1 grandfathering) and the ruleset decision (main ruleset requiring kit-ci + review-record, staged to active). The trust-boundary compensation introduced for the round-4 blocker changes merge protection on main beyond that frozen decision set: the new .github/CODEOWNERS file declares "Enforced only when the branch protection rule on main requires code-owner review (Require review from Code Owners)", and the T6 ruleset drill records "GET /repos/agentmerlin8/ai-software-factory/branches/main/protection/required_pull_request_reviews -> require_code_owner_reviews: true, required_approving_review_count: 1. The setting was PATCHed on 2026-11-06 and read back after the change." That makes merges of .github/workflows/, tools/review/ and kit-v0.1/review-panel.toml changes conditional on a new code-owner approving review, a strengthening of the merge gate that is reasonable but authorized by no recorded owner decision in the frozen contract, which predates the 2026-11-06 PATCH. The drill''s own no-bypass-actors note asserts the ruleset only requires the two checks, which is now not the whole story for main''s protection. Documenting the mechanism in architecture.md is not a recorded deviation.'
      required_change: 'Record the deviation before merge: add an owner decision to the frozen decision set explicitly approving the require_code_owner_reviews branch-protection change on main as a scope exception to any change to the owner merge gate (or revert the protection change), and reconcile the T6 evidence claim so it no longer implies main''s merge protection requires only the two ruleset checks.'
      actionable: true
