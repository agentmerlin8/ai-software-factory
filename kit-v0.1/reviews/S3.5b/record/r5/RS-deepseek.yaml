  findings:
    - id: RS-001
      severity: major
      rubric_dimension: security
      artifact_reference: package:diff@tools/review/ci_gate.py:174
      evidence: "the new coverage rule excludes, from the full-change coverage requirement, EVERY changed path falling under any records root plus each qualifying record directory — before the withheld-refusal logic ever runs: `excluded: list[str] = []`, `for prefix_path in list(roots) + [d for d, _ in qualifying]:` (ci_gate.py:173-177), then `missing = [path for path in required if not any(path.startswith(prefix) for prefix in excluded) and path not in covered]` (ci_gate.py:202-204), and only the survivors of that filter reach `deliberately_withheld`'s named refusal (ci_gate.py:214-228). The PR author owns the head commit, so a new source file committed under a records root (e.g. kit-v0.1/reviews/anything.py) is certified by the gate as 'full change base...head covered' while no package ever shipped it to any lens: the package builder withholds the same records tree, and the record's manifest withheld list can no longer refuse it because the path never reaches the withheld check (a withheld changed path is a named refusal everywhere else — test_withheld_changed_path_refused_as_deliberate_not_missing — but only for paths outside the exclusion). The production change that leaves the gate green while a real change went unreviewed: commit production code under kit-v0.1/reviews/ (unreviewed by the panel, invisible to the package, excluded from the coverage rule), so the shipped claim 'full-change coverage — every path changed base...head was packaged for review' is false for exactly those paths, and no test seeds a non-record change under the records root to prove such a path is refused."
      required_change: "confine the exclusion to provably review-only artifacts — the rendered record files (review.json, REVIEW-<pr>.md, the generated .gitignore) of each qualifying record directory and the ignored package-artifact names — and refuse with a named error any other changed path under a records root instead of silently excluding it, mirroring the withheld-path refusal so that no changed path can be certified without either being packaged or being explicitly refused."
      actionable: true