  decision: CHANGES_REQUESTED
  findings:
    - id: RA-001
      severity: major
      rubric_dimension: test_quality
      artifact_reference: package:diff@tools/review/record.py:1087
      evidence: "the check-side duplicate-findings-document guard (`if digest in seen_docs: fail('review record: duplicate findings document: …')` inside cmd_check) has no test. The only duplicate-document test added this round, test_dual_panel_refuses_duplicate_document, drives the render path and never check. Deleting this guard leaves the unit suite green, and a stored record whose two reviewer slots cite one finding-bearing document (review.json rewritten so both document_sha256 fields match that file) then passes check with a single document standing in for two panel slots — exactly the state deepseek RS-001 declared must be refused"
      required_change: "add a check-side test that renders a two-model panel with two distinct finding-bearing documents, rewrites the stored review.json so both slots cite the same finding-bearing document with matching document_sha256 values, and asserts check exits non-zero with the 'duplicate findings document' refusal at the cited hunk"
      actionable: true
    - id: RA-002
      severity: minor
      rubric_dimension: behavior
      artifact_reference: package:diff@tools/review/record.py:903
      evidence: "the triage signal is computed over every reviewer model, ingested external documents included: the at column renders findings['agreement']/len(panel_models) where panel_models is derived from all reviewers (line 828, external mapper models included), and annotate_agreement counts distinct finding models without excluding source=external (line 353). Round 1 scoped panel symmetry to internal lenses (qwen RA-005) but this round's N/M fix did not: an ingested external finding at the same (artifact, dimension) as a panel finding inflates the panel finding's agreement, and a two-model dual panel that also ingests an external document renders the agreement column over three models (2/3, 1/3) instead of the documented 2/2, 1/2 — a triage pair is misread as a third model's agreement"
      required_change: "compute the rendered panel size and the agreement numerator over internal-lens reviewers only (exclude role/source 'external') and pin the at column with a test that ingests an external document alongside a dual panel"
      actionable: true