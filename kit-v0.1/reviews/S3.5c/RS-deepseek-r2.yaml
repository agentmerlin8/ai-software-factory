schema: review.findings.v1
review:
  reviewer: review-security
  rubric_version: review-security-v1
  package_sha256: dc1058c5ed556886621c772fd16f2e7a0f43cc954e755cf1dcc8ae1b9977c9af
  base_sha: 8d353f83215e1930d252881b01b882cc95af215f
  head_sha: c1bfa989d5b1f3db499dbdde8c2273e97e8a2583
  decision: CHANGES_REQUESTED
  findings:
    - id: RS-001
      severity: major
      rubric_dimension: behavior
      artifact_reference: package:diff@tools/review/record.py:321
      evidence: "check_panel_symmetry skips reviewers whose role is 'external' before building coverage, and returns once len(coverage) <= 1; the docstring claims 'An empty panel is the maximal skip and is refused for the same reason' that a skipped lens reads as coverage, but a panel whose reviewers are all external leaves coverage empty and sails past the guard on both the render and the check path — a record with zero internal lenses renders and verifies, so a fully skipped panel reads as a completed review"
      required_change: "refuse by name, on the render and the check path alike, a panel with no internal-lens reviewers, before the external-skip branch or the len(coverage) <= 1 return can accept it"
      actionable: true
    - id: RS-002
      severity: major
      rubric_dimension: behavior
      artifact_reference: package:diff@tools/review/record.py:1094
      evidence: "compose_record strips role/model strings before the duplicate-slot refusal, but cmd_check builds slot = (role, model) from the stored record untrimmed: seen_slots, check_panel_symmetry's coverage keys, and the derived namespaced ids all use the raw stored label; a stored record tampered to duplicate a slot under a whitespace-variant model label ('qwen3.8-max' vs 'qwen3.8-max ') hits neither the duplicate role/model refusal nor the symmetry guard, and the phantom model inflates panel size and agreement denominators in the rendered Panel"
      required_change: "strip and otherwise normalize role and model on stored reviewer entries during check before slot, symmetry, coverage, and id derivation, and refuse duplicates on the normalized slot"
      actionable: true
    - id: RS-003
      severity: minor
      rubric_dimension: security
      artifact_reference: package:diff@tools/review/record.py:834
      evidence: "the Panel models summary renders ', '.join(panel_models) with no md_cell, while the same model strings are escaped through md_cell in the reviewer table rows; role/model labels are validated only as non-empty after strip, so a label carrying a newline or '|' breaks or corrupts the rendered REVIEW-<pr>.md table structure"
      required_change: "render each model name through md_cell on the models summary line, as everywhere else in the markdown"
      actionable: true
    - id: RS-004
      severity: minor
      rubric_dimension: behavior
      artifact_reference: package:diff@tools/review/record.py:828
      evidence: "panel_models is built from every reviewer entry, including role 'external' documents (e.g. model legacy-mapper-v0), and the findings-table 'at' column renders '{agreement}/{len(panel_models)}'; a dual internal panel plus one ingested external document then shows 2/3 and 1/3 where the architecture doc and the prior fix note promise agreement / panel size as 2/2 and 1/2, misstating the panel size for pair triage"
      required_change: "compute the at-column denominator over non-external reviewer models only (the panel), consistent with the symmetry scope"
      actionable: true
    - id: RS-005
      severity: minor
      rubric_dimension: behavior
      artifact_reference: package:diff@tools/review/record.py:380
      evidence: "the duplicate-document refusal is gated on lens['findings']: byte-identical approval documents (empty findings) are exempt, so one empty document still stands in for two model slots and the Panel renders two model names over one document hash; the round-1 RS-001 dual-slot exposure persists in this finding-free form, and the exemption lives in a code comment, not in the rendered artifact"
      required_change: "disclose in the Panel attribution note that finding-free documents are not de-duplicated and one byte-identical approval document may back multiple slots, or bind each slot to a distinct document hash"
      actionable: true