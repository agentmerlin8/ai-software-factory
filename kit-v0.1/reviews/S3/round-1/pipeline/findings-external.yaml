    - id: EX-002
      severity: major
      rubric_dimension: operational
      artifact_reference: onboarding/forge_probe.py:205
      evidence: 'External review 5658724504 (2026-10-26, medium): the ruleset list request reads only the first page (30 by default); an applicable ruleset on a later page makes the probe report missing protection.'
      required_change: 'Page the rulesets endpoint to exhaustion before fetching details, as the labels transport already does.'
      actionable: true
    - id: EX-003
      severity: major
      rubric_dimension: behavior
      artifact_reference: onboarding/forge_probe.py:491
      evidence: 'External review 5658724504 (2026-10-26, medium): selection does not filter target == branch, so an active tag ruleset using ~ALL can be chosen ahead of the default-branch ruleset.'
      required_change: 'Only rulesets whose target is branch may participate in branch-protection selection.'
      actionable: true
