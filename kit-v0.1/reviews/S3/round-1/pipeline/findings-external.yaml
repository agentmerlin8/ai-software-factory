      artifact_reference: onboarding/forge_probe.py:485
      evidence: 'External review 5658724504 (2026-10-26, high): an active ruleset including ~DEFAULT_BRANCH but excluding refs/heads/m* does not protect main, yet this matcher selects it; wildcard includes are also missed.'
      required_change: 'Implement GitHub-compatible ref-pattern matching for include AND exclude selectors; add wildcard and exclude regression cases.'
