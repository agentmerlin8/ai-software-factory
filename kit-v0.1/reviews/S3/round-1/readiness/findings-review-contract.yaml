schema: review.findings.v1
review:
  reviewer: review-contract
  rubric_version: review-contract-v1
  package_sha256: de145807307d37da509d48552638156a2669ba07b9ff3cc40cc0a6eeae87dd06
  base_sha: 152b205b48937a3a12020c02c8378022d088d86e
  head_sha: 2bd431cd82e0938b42309ed3d1ff808d9e2260ad
  decision: CHANGES_REQUESTED
  findings:
    - id: RC-001
      severity: minor
      rubric_dimension: docs_process
      artifact_reference: onboarding/readiness.py:1250
      evidence: "+def hash_walk(root: Path) -> dict[str, str]:\n+    \"\"\"Read-only-law helper (used by the hash-walk test): rel path ->\n+    sha256 of every regular file under root.\"\"\" — but the hash-walk test in the same package defines and uses its own local copy (onboarding/tests/test_readiness.py:58 \"+def hash_walk(root: Path) -> dict[str, str]:\"); no test references RD.hash_walk, so the shipped helper is unused and its docstring claim has no corresponding artifact."
      required_change: "Either delete the unused hash_walk helper from onboarding/readiness.py or make the hash-walk tests (test_read_only_hash_walk, test_fixture_trees_pristine) call it; in both cases the docstring must stop claiming usage that does not exist."
      actionable: true
    - id: RC-002
      severity: major
      rubric_dimension: contract_fidelity
      artifact_reference: onboarding/tests/test_readiness.py:330
      evidence: "Contract acceptance: \"The test-out scripts ship and run green against `benchmark-app` as a smoke.\" The Diff stat ships only 4 files (onboarding/readiness.py, onboarding/registry.json, onboarding/tests/test_readiness.py, onboarding/tests/test_docs_consistency.py) — no hunk ships a test-out script or touches benchmark-app — and the gate evidence records only `python3 -m unittest`, `python3 tools/gates/test_gate.py`, `python3 tools/config_validator.py templates/...`, and CI runs at head; no benchmark-app smoke run appears anywhere in the package. The closest acceptance artifact in the Diff is the fixture-scoped bad-home run (\"The acceptance run of record: every seeded defect FAILs precisely.\"), which does not cover this criterion."
      required_change: "Show acceptance criterion 3 satisfied inside the review record: add gate evidence of the shipped test-out scripts running green against benchmark-app as a smoke at head 2bd431c, or ship/point to the test-out script hunks this slice adds, or record an explicit owner-approved deviation deferring the benchmark-app smoke (as the contract already does only for the FULL conformance smoke, not for the test-out script smoke)."
      actionable: true
    - id: RC-003
      severity: minor
      rubric_dimension: docs_process
      artifact_reference: onboarding/tests/test_readiness.py:6
      evidence: "Module docstring claims \"Every required check also has a FAIL-path test via the make_home/verify_home generator (one defect per test, precise detail assertions).\" — but the package shows no FAIL-path test for the required checks C-9 and W-5: \"C-9\" appears only in the good-home PASS list (test_readiness.py:226) and the registry-id enumeration (test_readiness.py:1374), and no defect in apply_defects or dataset mutation exercises W-5 (test_c8_fail_ledger_invalid asserts C-8 only); the claimed coverage has no corresponding artifact for these two checks."
      required_change: "Add FAIL-path tests for C-9 (e.g. toolchain probe failure) and W-5 (e.g. ledger-invalid asserted on the W-5 row), or correct the module docstring so the coverage claim matches the tests actually shipped."
      actionable: true
    - id: RC-004
      severity: minor
      rubric_dimension: docs_process
      artifact_reference: onboarding/tests/test_docs_consistency.py:5
      evidence: "Module docstring states \"ONE test asserting:\" followed by the pipeline/deleted-asset assertions, but the same file ships TWO test methods: \"+    def test_kickoff_template_gate_list_includes_spec_freeze(self):\" (test_docs_consistency.py:60) and \"+    def test_docs_name_the_pipeline_and_drop_deleted_assets(self) -> None:\" (test_docs_consistency.py:77) — the docstring does not describe the shipped contents."
      required_change: "Update the module docstring of onboarding/tests/test_docs_consistency.py to describe both shipped tests (the G7 KICKOFF-template gate-list test and the pipeline/deleted-asset test)."
      actionable: true
